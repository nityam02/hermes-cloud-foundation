# Security scans: gitleaks (tree + history), trivy config, checkov, tflint, conftest verify and the
# private forbidden-terms check. Runs on every push/PR and weekly (new checks, new advisories).
# Tool binaries are installed by scripts/ci/install-tools.sh, pinned by version and SHA-256;
# the trivy and gitleaks GitHub Actions are deliberately not used (docs/security/security-architecture.md).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: Install pinned, checksum-verified gitleaks, trivy and conftest
        run: |
          scripts/ci/install-tools.sh "$RUNNER_TEMP/bin" gitleaks trivy conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install checkov (pinned)
        run: python -m pip install --disable-pip-version-check --no-input "checkov==3.4.5"
      - name: Forbidden-terms list (repository secret; absent on forks)
        env:
          TERMS: ${{ secrets.HERMES_FORBIDDEN_TERMS }}
        run: |
          if [ -n "$TERMS" ]; then
            umask 077
            printf '%s\n' "$TERMS" > "$RUNNER_TEMP/forbidden-terms.txt"
            echo "HERMES_FORBIDDEN_TERMS_FILE=$RUNNER_TEMP/forbidden-terms.txt" >> "$GITHUB_ENV"
          fi
      - name: Script self-tests
        run: scripts/ci/test-scripts.sh
      - name: "Security scan (strict mode: a missing tool fails the job)"
        env:
          HERMES_TFLINT_INIT: "1"
          HERMES_SCAN_OUT: ${{ github.workspace }}/.hermes/security-scan
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/security-scan.sh --strict --sarif
      - name: Upload trivy SARIF
        if: always() && hashFiles('.hermes/security-scan/trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .hermes/security-scan/trivy.sarif
          category: trivy-config
      - name: Upload gitleaks SARIF
        if: always() && hashFiles('.hermes/security-scan/gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: .hermes/security-scan/gitleaks.sarif
          category: gitleaks
