# Markdown link check. Pull requests check local files and anchors only (fast, no network);
# the weekly run also checks external links. Configuration: lychee.toml.
name: docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "lychee.toml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "lychee.toml", ".github/workflows/docs.yml"]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local links and anchors
        if: github.event_name != 'schedule'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --include-fragments --no-progress './**/*.md'
          fail: true
      - name: All links (weekly)
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
