apiVersion: hermes/v1alpha1
kind: MigrationWorkflow
metadata:
  id: secrets
  title: "Secrets migration without Hermes ever handling values"
  applies_to: [secrets, key-management, certificates]
spec:
  steps:
    - id: inventory-metadata
      phase: prepare
      title: "List secrets, consumers and rotation from metadata"
      description: >-
        Use the inventory (names, KMS keys, rotation settings, tags, uses-secret relationships).
        Discovery never reads values and Hermes never stores them.
      automation: hermes
      gate: none
      reversible: true
      rollback: "Not applicable; read-only."
      risks:
        - "Secrets embedded in environment variables or code are invisible to the inventory"
      validation:
        - "Each secret has an owner and a list of consumers"
      source_impact: none

    - id: classify
      phase: prepare
      title: "Classify each secret: re-issue or copy"
      description: >-
        Prefer re-issuing on the target (new database passwords for the new database, new API
        keys from the issuer) over copying. Copy only credentials that cannot be re-issued, and
        rotate them after cutover so only one copy remains valid.
      automation: manual
      gate: approval
      reversible: true
      rollback: "Not applicable; decision only."
      risks:
        - "Copied credentials remain valid in two clouds"
      validation:
        - "Every secret labelled re-issue or copy"
      source_impact: none

    - id: provision-containers
      phase: provision
      title: "Create secret containers on the target"
      description: "Provision names with Hermes (workloads.secrets.names); values are set out-of-band."
      automation: hermes
      gate: approval
      reversible: true
      rollback: "hermes destroy --approve <plan-id-prefix> (containers only)."
      risks: []
      validation:
        - "Containers exist; access granted only to services that list them in secret_env"
      source_impact: none

    - id: set-values
      phase: synchronize
      title: "Set values out-of-band"
      description: >-
        An authorized operator sets each value directly in the target secret store from a secure
        workstation, reading copy-class values from the source store. Values never pass through
        Hermes, files, shell history, tickets, chat or CI logs. Use a two-person rule for
        production.
      automation: manual
      gate: approval
      reversible: true
      rollback: "Disable or destroy the secret version on the target."
      risks:
        - "Values leak through clipboard managers, shell history or screen sharing"
      validation:
        - "Each secret has exactly one enabled version (presence check, never value comparison)"
      source_impact: read-only-load

    - id: configure-rotation
      phase: provision
      title: "Configure rotation on the target"
      description: >-
        AWS rotation Lambdas do not move. GCP Secret Manager rotation schedules publish
        notifications to Pub/Sub and you implement the rotation; Alibaba Cloud KMS Secrets Manager
        offers managed rotation for supported secret types and custom rotation otherwise.
      automation: manual
      gate: none
      reversible: true
      rollback: "Remove the rotation schedule."
      risks:
        - "Rotation that is never tested breaks consumers on first run"
      validation:
        - "One rotation executed in non-production and consumers kept working"
      source_impact: none

    - id: validate-presence
      phase: validate
      title: "Validate presence and access"
      description: "Check each secret exists with an enabled version and only intended identities can access it; never compare or print values."
      automation: hermes
      gate: validation
      reversible: true
      rollback: "Not applicable; read-only."
      risks: []
      validation:
        - "hermes migrate validate secret checks pass"
      source_impact: none

    - id: cutover
      phase: cutover
      title: "Consumers read secrets from the target"
      description: "Services on the target receive secrets through secret_env injection by the native mechanism."
      automation: manual
      gate: approval
      reversible: true
      rollback: "Not applicable; services still on the source keep using the source store."
      risks: []
      validation:
        - "No target service reads from the source secret store"
      source_impact: none

    - id: revoke-source
      phase: decommission
      title: "Rotate copied credentials and delete source secrets"
      description: >-
        After the rollback window, rotate every copy-class credential and delete source secrets
        (Secrets Manager schedules deletion with a 7-30 day recovery window).
      automation: manual
      gate: approval
      reversible: true
      rollback: "Restore the secret during the recovery window."
      risks:
        - "Deleting a secret still used by a forgotten source workload breaks it"
      validation:
        - "No GetSecretValue calls on source secrets for the observation period (CloudTrail)"
      source_impact: modifies-source-config
