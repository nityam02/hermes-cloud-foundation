    provider: aws
    kind: egress-internet
    usd_per_gb: 0.09
    applies_to: "Data transfer out to the internet, first 10 TB/month after the 100 GB/month free allowance; US and most EU regions [S]"
    source: "https://aws.amazon.com/ec2/pricing/on-demand/"
  - id: aws-internet-egress-tier2
    provider: aws
    kind: egress-internet
    usd_per_gb: 0.085
    applies_to: "Data transfer out to the internet, next 40 TB/month; US and most EU regions [S]"
    source: "https://aws.amazon.com/ec2/pricing/on-demand/"
  - id: aws-internet-egress-tier3
    provider: aws
    kind: egress-internet
    usd_per_gb: 0.07
    applies_to: "Data transfer out to the internet, next 100 TB/month; US and most EU regions [S]"
    source: "https://aws.amazon.com/ec2/pricing/on-demand/"
  - id: aws-internet-egress-tier4
    provider: aws
    kind: egress-internet
    usd_per_gb: 0.05
    applies_to: "Data transfer out to the internet, above 150 TB/month; US and most EU regions [S]"
    source: "https://aws.amazon.com/ec2/pricing/on-demand/"
  - id: aws-inter-region-typical
