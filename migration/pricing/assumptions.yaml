notes:
  - "Ingress is not charged by GCP or Alibaba Cloud (CDT bills outbound traffic only). The cost of moving data from AWS is therefore AWS data transfer out plus any target transfer-service fee."
  - "Transfer cost range (designed for hermes migrate assess): low = cheapest viable path (for GCP, the managed-private-network rate for the region when the S3 region is supported; otherwise tiered AWS egress), high = tiered AWS internet egress with no waiver. Report the rate ids used."
  - "GCP publishes per-GiB rates. They are stored unchanged in usd_per_gb; applying them per GB overstates cost by about 7%, which keeps estimates conservative."
  - "Free allowances: AWS 100 GB/month to the internet aggregated across services and regions (except China and GovCloud) [V]; Alibaba CDT 200 GB/month outside the Chinese mainland and 20 GB inside, BGP (Multi-ISP) only [V]; GCP free tier not modelled [U]."
  - "Exit programme, AWS: free data transfer out to the internet for customers moving off AWS may apply; it requires a request to and approval by AWS Support before the move, covers moving all data (from all eligible accounts, or all data of a particular service), and must complete within a window (180 days for non-EU customers per the 2026-10-08 update; EU customers follow the AWS EU Data Act addendum). Earlier coverage listed CloudFront, Direct Connect, Snow Family and Global Accelerator transfers as excluded. Verify current terms: https://aws.amazon.com/blogs/aws/free-data-transfer-out-to-internet-when-moving-out-of-aws/ [V for the blog terms, S for exclusions]."
  - "Exit programme, GCP (relevant only when leaving GCP, for example a rollback after cutover): free data transfer for customers exiting Google Cloud may apply; it requires an Exit Notice before the agreement ends, migration within an initiation period, a Completion Notice and a full exit of the service; credit appears on the final invoice; internet transfers only. Verify: https://cloud.google.com/exit-cloud [S]."
  - "Multicloud, GCP (EU and UK): Data Transfer Essentials (2025-09-10) may zero-rate qualifying egress between GCP and another provider for workloads of one organization running in parallel; opt-in, and traffic must be designated. Useful during coexistence, not for a one-time exit. Verify: https://cloud.google.com/blog/products/networking/new-for-the-uk-and-eu-no-cost-multicloud-data-transfer-essentials [S]."
  - "Exit programme, Alibaba Cloud: no exit or switching waiver programme was found in this review [U]. The EU Data Act bans switching charges, including egress for switching, from 2027-01-12; it may apply to EU customers of any provider; verify with the provider [S]."
  - "Not modelled: request/operation charges (S3 GET/LIST, OSS PUT), archive restore and retrieval fees, VPN hourly connection fees, interconnect port and bandwidth fees (AWS Interconnect - multicloud is priced by selected bandwidth and scope, with one free 500 Mbps local connection per region from May 2026 [V]), AWS DMS instance-hours, DTS incremental instance-hours, target compute/storage, and dual-running costs during coexistence."
  - "Rollback and reverse replication send data out of the target, at the target's internet egress rates (GCP Premium Tier or Alibaba CDT above)."
