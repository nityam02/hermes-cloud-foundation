# Hermes PricingAssumptions (data-contracts.md section 6).
# Indicative list prices used by `hermes migrate assess` for transfer cost ranges. Never facts.
# Override with your own file (negotiated rates, other regions). Evidence labels in applies_to:
#   [V] read on the provider's own page during the review, [S] secondary source or search summary of the
#   provider page, [U] unverified/prior knowledge. Notes explain what is NOT modelled.
apiVersion: hermes/v1alpha1
kind: PricingAssumptions
metadata:
  retrieved_at: "2026-11-18"
  disclaimer: "Indicative list prices for estimation only; verify with the provider's current pricing and your agreements."
rates:
