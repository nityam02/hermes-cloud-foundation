  # ---------------------------------------------------------------------------
  # Entries added for patterns that similar names hide
  # ---------------------------------------------------------------------------
  - id: aws-sqs-fifo-queue
    category: messaging-queue
    capability: messaging
    source:
      provider: aws
      service: "Amazon SQS (FIFO queues)"
      resource_types: ["AWS::SQS::Queue"]
      match:
        fifo_queue: [true]
    targets:
      gcp:
        service: "Pub/Sub subscriptions with message ordering (ordering keys)"
        alternatives: ["Pub/Sub with exactly-once delivery (pull, same region)", "Google Cloud Managed Service for Apache Kafka (partition ordering)"]
        compatibility: partial
        complexity: high
        data_migration: optional
        workflow: messaging
        tooling: ["Hermes Platform spec (topic + subscription per queue; ordering configured by the adapter or manually)"]
        lock_in: medium
        hermes_support: partial
        differences:
          - "Message groups map to ordering keys; order holds per key and per region, and publishing with ordering keys is throughput-limited per key"
          - "Content-based or ID-based deduplication (5-minute window) has no equivalent; exactly-once delivery covers redelivery, not duplicate publishes"
          - "A failed message blocks its ordering key until it is acknowledged or dead-lettered"
        issues:
          - "Ordering across the switch from SQS to Pub/Sub is not guaranteed; drain the FIFO queue fully before target consumers start, or accept reordering"
        references: ["https://docs.cloud.google.com/pubsub/docs/exactly-once-delivery", "https://docs.cloud.google.com/pubsub/quotas"]
      alibaba:
        service: "ApsaraMQ for RocketMQ (ordered messages)"
        alternatives: ["Simple Message Queue (SMQ, formerly MNS) with application-level ordering"]
        compatibility: partial
        complexity: high
        data_migration: optional
        workflow: messaging
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "Ordering is per message group/sharding key on RocketMQ; SMQ queues do not offer SQS FIFO semantics"
          - "Deduplication semantics differ; consumers must be idempotent"
        issues:
          - "Hermes provisions SMQ queues, not RocketMQ; ordered queues need the provider tool"
          - "Drain the FIFO queue fully before target consumers start"
        references: ["https://www.alibabacloud.com/help/en/apsaramq-for-rocketmq/"]

