# Hermes ServiceCatalog (data-contracts.md section 4).
# Source -> target capability mapping for AWS -> GCP and AWS -> Alibaba Cloud.
# How to read this file, match attribute keys, review status and evidence levels:
# docs/migration/service-mapping.md. The full table is generated: `hermes migrate catalog --format markdown`.
# hermes_support describes the Hermes v1alpha1 Platform scope (see docs/migration/service-mapping.md);
# the implementation status of the provider adapters is tracked in docs/limitations.md.
apiVersion: hermes/v1alpha1
kind: ServiceCatalog
metadata:
  reviewed_at: "2026-11-18"
  disclaimer: "Mappings describe capability equivalence, not operational equivalence. Verify against current provider documentation."
entries:
  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------
  - id: aws-vpc
    category: networking
    capability: network
    source:
      provider: aws
      service: "Amazon VPC"
      resource_types: ["AWS::EC2::VPC", "AWS::EC2::InternetGateway", "AWS::EC2::VPCGatewayAttachment", "AWS::EC2::DHCPOptions"]
    targets:
      gcp:
        service: "VPC network"
        alternatives: ["Shared VPC"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network block)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "GCP VPC networks are global; subnets are regional and routes are network-wide"
          - "There is no internet gateway object; internet access uses the default route plus external IPs or Cloud NAT"
          - "DHCP option sets have no equivalent; internal DNS is provided by Cloud DNS"
        issues:
          - "Choose a target CIDR that does not overlap any source VPC so hybrid connectivity can route between them"
        references: ["https://docs.cloud.google.com/vpc/docs/vpc"]
      alibaba:
        service: "Virtual Private Cloud (VPC)"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network block)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "VPCs are regional like AWS; subnets are called vSwitches and are zonal"
          - "No internet gateway object; internet access uses EIPs, NAT Gateway or public load balancers"
        issues:
          - "Choose a target CIDR that does not overlap any source VPC"
        references: ["https://www.alibabacloud.com/help/en/vpc/"]

  - id: aws-subnet
    category: networking
    capability: network
    source:
      provider: aws
      service: "Amazon VPC subnets"
      resource_types: ["AWS::EC2::Subnet"]
    targets:
      gcp:
        service: "VPC subnets"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network.zones)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "Subnets are regional and span all zones; AWS subnets are bound to one Availability Zone"
          - "Public/private is not a subnet property; it depends on external IPs and firewall rules"
        issues: []
        references: ["https://docs.cloud.google.com/vpc/docs/subnets"]
      alibaba:
        service: "vSwitches"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network.zones)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "vSwitches are zonal, as AWS subnets are; zone availability of instance types and services differs by region"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/vpc/"]

  - id: aws-rds-db-subnet-group
    category: networking
    capability: database
    source:
      provider: aws
      service: "Amazon RDS DB subnet groups"
      resource_types: ["AWS::RDS::DBSubnetGroup"]
    targets:
      gcp:
        service: "Private services access allocated range (Cloud SQL private IP)"
        alternatives: ["Private Service Connect for Cloud SQL"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (workloads.database creates the private services access connection)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "There is no subnet-group object: Cloud SQL private IPs come from an allocated range peered to the VPC through Service Networking"
          - "Zone placement for high availability is chosen by Cloud SQL (availability_type REGIONAL), not by listing subnets"
        issues:
          - "The allocated range must not overlap source CIDRs if hybrid connectivity routes between the clouds during migration"
        references: ["https://docs.cloud.google.com/sql/docs/postgres/private-ip"]
      alibaba:
        service: "vSwitch selection for ApsaraDB RDS"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (workloads.database places the instance in the platform vSwitches)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "The instance references a vSwitch (and a secondary zone for high availability) directly; there is no reusable subnet-group object"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/vpc/"]

  - id: aws-vpc-peering-connection
    category: networking
    capability: network
    source:
      provider: aws
      service: "Amazon VPC peering connections"
      resource_types: ["AWS::EC2::VPCPeeringConnection"]
    targets:
      gcp:
        service: "VPC Network Peering"
        alternatives: ["Shared VPC", "Network Connectivity Center", "Cloud VPN between VPCs"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: foundation
        tooling: ["google_compute_network_peering (not generated by Hermes)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Peering is configured from both networks; custom route import/export is explicit"
          - "Like AWS, peering is non-transitive; GCP additionally caps peering connections and peered-network routes per VPC"
        issues:
          - "Peered CIDRs must not overlap; re-plan address space before recreating peerings in the target"
          - "A peering that crosses the source/target boundary during migration is hybrid connectivity (VPN/Interconnect), not VPC peering"
        references: ["https://docs.cloud.google.com/vpc/docs/vpc-peering"]
      alibaba:
        service: "VPC peering connections"
        alternatives: ["Cloud Enterprise Network (CEN) transit routers"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: foundation
        tooling: ["alicloud_vpc_peer_connection (not generated by Hermes)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Peering requires routes in both VPCs; cross-region and cross-account peering are billed for transferred data"
          - "CEN is the managed hub alternative for many VPCs, comparable to AWS Transit Gateway"
        issues:
          - "Peered CIDRs must not overlap"
        references: ["https://www.alibabacloud.com/help/en/vpc/"]

  - id: aws-security-group
    category: networking
    capability: network
    source:
      provider: aws
      service: "Amazon VPC security groups and network ACLs"
      resource_types: ["AWS::EC2::SecurityGroup", "AWS::EC2::SecurityGroupIngress", "AWS::EC2::SecurityGroupEgress", "AWS::EC2::NetworkAcl", "AWS::EC2::NetworkAclEntry"]
    targets:
      gcp:
        service: "Cloud NGFW firewall rules and network firewall policies"
        alternatives: ["Hierarchical firewall policies"]
        compatibility: partial
        complexity: medium
        data_migration: none
        workflow: foundation
        tooling: ["Hermes least-privilege rules derived from the Platform spec"]
        lock_in: low
        hermes_support: partial
        differences:
          - "Rules attach to the network and target instances by network tags or service accounts, not by group membership"
          - "Security-group-to-security-group references must be re-expressed with tags, service accounts or secure tags"
          - "Network ACLs have no separate equivalent; use firewall policy priorities and deny rules"
        issues:
          - "Hermes generates rules for its own workloads from the spec; it does not translate arbitrary source rules"
        references: ["https://docs.cloud.google.com/firewall/docs/firewalls"]
      alibaba:
        service: "Security groups"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes least-privilege rules derived from the Platform spec"]
        lock_in: low
        hermes_support: partial
        differences:
          - "Stateful like AWS, but rules support both allow and deny with priorities"
          - "Network ACLs exist per vSwitch as a separate feature"
        issues:
          - "Hermes generates rules for its own workloads; arbitrary rule sets are re-created manually"
        references: ["https://www.alibabacloud.com/help/en/ecs/"]

  - id: aws-route-table
    category: networking
    capability: network
    source:
      provider: aws
      service: "Amazon VPC route tables"
      resource_types: ["AWS::EC2::RouteTable", "AWS::EC2::Route", "AWS::EC2::SubnetRouteTableAssociation"]
    targets:
      gcp:
        service: "VPC routes"
        alternatives: ["Policy-based routes"]
        compatibility: partial
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network block)"]
        lock_in: low
        hermes_support: partial
        differences:
          - "Routes belong to the VPC network and can target instances by network tag; there is no per-subnet route table"
          - "Dynamic routes are learned by Cloud Router over BGP"
        issues: []
        references: ["https://docs.cloud.google.com/vpc/docs/routes"]
      alibaba:
        service: "VPC route tables"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network block)"]
        lock_in: low
        hermes_support: partial
        differences:
          - "System and custom route tables associated with vSwitches, similar to AWS"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/vpc/"]

  - id: aws-nat-gateway
    category: networking
    capability: network
    source:
      provider: aws
      service: "NAT gateways"
      resource_types: ["AWS::EC2::NatGateway"]
    targets:
      gcp:
        service: "Cloud NAT"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network.nat)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "Cloud NAT is a regional, software-defined service configured on a Cloud Router; no per-zone gateways"
          - "Port allocation per VM is configurable; exhaustion shows up as dropped connections"
        issues:
          - "Egress IPs change; partners that allowlist source NAT IPs must be updated"
        references: ["https://docs.cloud.google.com/nat/docs/overview"]
      alibaba:
        service: "NAT Gateway (Internet NAT gateway)"
        alternatives: []
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: foundation
        tooling: ["Hermes Platform spec (network.nat)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "SNAT entries map vSwitches to Elastic IP addresses explicitly"
        issues:
          - "Egress IPs change; update partner allowlists"
        references: ["https://www.alibabacloud.com/help/en/nat-gateway/"]

  - id: aws-elastic-ip
    category: networking
    capability: network
    source:
      provider: aws
      service: "Elastic IP addresses"
      resource_types: ["AWS::EC2::EIP", "AWS::EC2::EIPAssociation"]
    targets:
      gcp:
        service: "Static external IP addresses"
        alternatives: ["Bring your own IP (BYOIP) for owned prefixes"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: traffic-cutover
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "Addresses are regional or global (global for global external load balancers)"
        issues:
          - "Provider-owned IP addresses cannot move between clouds; every consumer of a literal IP must be updated"
        references: ["https://docs.cloud.google.com/vpc/docs/ip-addresses"]
      alibaba:
        service: "Elastic IP Address (EIP)"
        alternatives: ["Anycast EIP"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: traffic-cutover
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "EIPs are billed by bandwidth or by data transfer (CDT); choose the metering mode explicitly"
        issues:
          - "Provider-owned IP addresses cannot move between clouds"
        references: ["https://www.alibabacloud.com/help/en/eip/"]

  - id: aws-vpc-endpoint
    category: networking
    capability: network
    source:
      provider: aws
      service: "VPC endpoints (gateway, interface) and PrivateLink services"
      resource_types: ["AWS::EC2::VPCEndpoint", "AWS::EC2::VPCEndpointService"]
    targets:
      gcp:
        service: "Private Service Connect"
        alternatives: ["Private Google Access"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: foundation
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "Access to Google APIs from private subnets usually uses Private Google Access rather than per-service endpoints"
          - "Endpoint policies have no direct equivalent; VPC Service Controls provide perimeter-style restrictions"
        issues: []
        references: ["https://docs.cloud.google.com/vpc/docs/private-service-connect"]
      alibaba:
        service: "PrivateLink"
        alternatives: []
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: foundation
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "Many Alibaba Cloud services are reached through VPC-internal endpoints without a separate endpoint resource"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/privatelink/"]

  - id: aws-transit-gateway
    category: hybrid-connectivity
    capability: network
    source:
      provider: aws
      service: "AWS Transit Gateway"
      resource_types: ["AWS::EC2::TransitGateway", "AWS::EC2::TransitGatewayAttachment", "AWS::EC2::TransitGatewayVpcAttachment", "AWS::EC2::TransitGatewayRouteTable"]
    targets:
      gcp:
        service: "Network Connectivity Center"
        alternatives: ["VPC Network Peering", "Shared VPC"]
        compatibility: partial
        complexity: high
        data_migration: none
        workflow: hybrid-connectivity
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "A single global VPC often replaces several regional VPCs joined by a transit gateway"
          - "Route table segmentation per attachment is modelled differently (hubs, spokes and route tables)"
        issues:
          - "Transit topology must be redesigned, not translated"
        references: ["https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center"]
      alibaba:
        service: "Cloud Enterprise Network (CEN) with transit routers"
        alternatives: ["VPC peering"]
        compatibility: compatible
        complexity: high
        data_migration: none
        workflow: hybrid-connectivity
        tooling: []
        lock_in: medium
        hermes_support: not-implemented
        differences:
          - "Transit routers are regional and joined in a CEN instance; cross-region bandwidth is purchased separately"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/cen/"]

  - id: aws-site-to-site-vpn
    category: hybrid-connectivity
    capability: network
    source:
      provider: aws
      service: "AWS Site-to-Site VPN"
      resource_types: ["AWS::EC2::VPNConnection", "AWS::EC2::VPNGateway", "AWS::EC2::CustomerGateway", "AWS::EC2::VPNConnectionRoute"]
    targets:
      gcp:
        service: "HA VPN with Cloud Router"
        alternatives: ["Cloud Interconnect", "Cross-Cloud Interconnect"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: hybrid-connectivity
        tooling: []
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "The 99.99% HA VPN SLA requires two gateway interfaces and redundant tunnels; an AWS peer needs four tunnels"
          - "BGP is mandatory for HA VPN dynamic routing"
        issues:
          - "Existing on-premises VPNs into AWS must be re-established towards the target with new peer IPs and keys"
        references: ["https://docs.cloud.google.com/network-connectivity/docs/vpn/how-to/connect-ha-vpn-aws-peer-gateway"]
      alibaba:
        service: "VPN Gateway (IPsec-VPN)"
        alternatives: ["Express Connect"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: hybrid-connectivity
        tooling: []
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Dual-tunnel IPsec-VPN connections with optional BGP; BGP is disabled by default"
        issues:
          - "Existing VPNs must be re-established with new peer IPs and keys"
        references: ["https://help.aliyun.com/en/vpn/sub-product-ipsec-vpn/user-guide/create-and-manage-an-ipsec-vpn-connection-in-dual-tunnel-mode"]

  # ---------------------------------------------------------------------------
  # Compute
  # ---------------------------------------------------------------------------
  - id: aws-ec2-instance
    category: compute
    capability: compute
    source:
      provider: aws
      service: "Amazon EC2 instances"
      resource_types: ["AWS::EC2::Instance"]
    targets:
      gcp:
        service: "Compute Engine"
        alternatives: ["Cloud Run (after containerization)", "Google Kubernetes Engine"]
        compatibility: compatible
        complexity: medium
        data_migration: optional
        workflow: stateless-rebuild
        tooling: ["Migrate to Virtual Machines (rehost)", "Image build pipelines / configuration management (rebuild)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Machine families and sizes differ; map by vCPU, memory, architecture (x86/Arm) and local disk needs"
          - "Instance metadata service, user data and instance profiles are replaced by GCE metadata and attached service accounts"
        issues:
          - "Hermes v1alpha1 has no VM capability; rebuild as containers where possible or rehost with the provider tool"
          - "VM-hosted Docker managed by configuration management (for example Ansible on EC2): rehost to Compute Engine and keep the playbooks, or re-platform the same images to Cloud Run; re-platforming moves host-level settings (volumes, host networking, cron, log agents) into the image or the platform"
          - "Instances with source/destination check disabled are routers, NAT or VPN relays; they are classified by the aws-ec2-network-appliance entry"
          - "Licensed operating systems and software may need license changes"
        references: ["https://docs.cloud.google.com/migrate/virtual-machines/docs"]
      alibaba:
        service: "Elastic Compute Service (ECS)"
        alternatives: ["Serverless App Engine (after containerization)"]
        compatibility: compatible
        complexity: medium
        data_migration: optional
        workflow: stateless-rebuild
        tooling: ["Server Migration Center (rehost)", "Image build pipelines / configuration management (rebuild)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Instance families and sizes differ; RAM roles replace instance profiles"
        issues:
          - "Hermes v1alpha1 has no VM capability"
          - "VM-hosted Docker managed by configuration management: rehost to ECS and keep the playbooks, or re-platform the same images to SAE"
        references: ["https://www.alibabacloud.com/help/en/smc/"]

  - id: aws-auto-scaling-group
    category: compute
    capability: compute
    source:
      provider: aws
      service: "Amazon EC2 Auto Scaling and launch templates"
      resource_types: ["AWS::AutoScaling::AutoScalingGroup", "AWS::AutoScaling::LaunchConfiguration", "AWS::EC2::LaunchTemplate", "AWS::AutoScaling::ScalingPolicy"]
    targets:
      gcp:
        service: "Managed instance groups with instance templates"
        alternatives: ["Cloud Run", "Google Kubernetes Engine"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: stateless-rebuild
        tooling: []
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Regional managed instance groups spread across zones; autoscaling signals and lifecycle hooks differ"
        issues:
          - "Prefer moving these workloads to containers (Hermes compute capability)"
        references: ["https://docs.cloud.google.com/compute/docs/instance-groups"]
      alibaba:
        service: "Auto Scaling (ESS) with scaling configurations or launch templates"
        alternatives: ["Serverless App Engine"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: stateless-rebuild
        tooling: []
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Scaling groups, rules and lifecycle hooks are similar in concept; parameters differ"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/auto-scaling/"]

  - id: aws-ebs-volume
    category: block-storage
    capability: none
    source:
      provider: aws
      service: "Amazon EBS volumes"
      resource_types: ["AWS::EC2::Volume", "AWS::EC2::VolumeAttachment"]
    targets:
      gcp:
        service: "Persistent Disk / Hyperdisk"
        alternatives: []
        compatibility: compatible
        complexity: medium
        data_migration: required
        workflow: manual-review
        tooling: ["Migrate to Virtual Machines (with the attached instance)", "File-level copy (rsync)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "Performance is provisioned differently (disk type, size-based or provisioned IOPS/throughput)"
          - "Regional persistent disks replicate synchronously across two zones; EBS is single-AZ"
        issues:
          - "Volumes move with their instance or by file-level copy; block snapshots are not portable between clouds"
        references: ["https://docs.cloud.google.com/compute/docs/disks"]
      alibaba:
        service: "Elastic Block Storage (ESSD cloud disks)"
        alternatives: []
        compatibility: compatible
        complexity: medium
        data_migration: required
        workflow: manual-review
        tooling: ["Server Migration Center (with the attached instance)", "File-level copy (rsync)"]
        lock_in: low
        hermes_support: not-implemented
        differences:
          - "ESSD performance levels (PL0-PL3) replace gp3/io2 provisioning"
        issues:
          - "Block snapshots are not portable between clouds"
        references: ["https://www.alibabacloud.com/help/en/ecs/"]

  - id: aws-ecs-cluster
    category: container-orchestration
    capability: compute
    source:
      provider: aws
      service: "Amazon ECS clusters and capacity providers"
      resource_types: ["AWS::ECS::Cluster", "AWS::ECS::CapacityProvider", "AWS::ECS::ClusterCapacityProviderAssociations"]
    targets:
      gcp:
        service: "Cloud Run"
        alternatives: ["Google Kubernetes Engine Autopilot"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: container-workload
        tooling: ["Hermes Platform spec (workloads.compute)"]
        lock_in: medium
        hermes_support: implemented
        differences:
          - "Cloud Run has no cluster or capacity-provider object; capacity is per service"
        issues: []
        references: ["https://docs.cloud.google.com/run/docs"]
      alibaba:
        service: "Serverless App Engine (SAE)"
        alternatives: ["Container Service for Kubernetes (ACK)", "Elastic Container Instance (ECI)"]
        compatibility: compatible
        complexity: low
        data_migration: none
        workflow: container-workload
        tooling: ["Hermes Platform spec (workloads.compute)"]
        lock_in: medium
        hermes_support: implemented
        differences:
          - "Applications are grouped in namespaces; there is no capacity-provider concept"
        issues: []
        references: ["https://www.alibabacloud.com/help/en/sae/"]

  - id: aws-ecs-service
    category: serverless-container
    capability: compute
    source:
      provider: aws
      service: "Amazon ECS services and task definitions (Fargate or EC2 launch type)"
      resource_types: ["AWS::ECS::Service", "AWS::ECS::TaskDefinition", "AWS::ApplicationAutoScaling::ScalableTarget"]
    targets:
      gcp:
        service: "Cloud Run services"
        alternatives: ["Google Kubernetes Engine", "Cloud Run jobs (for scheduled or batch tasks)"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: container-workload
        tooling: ["Hermes Platform spec (workloads.compute)", "OCI image copy by digest (skopeo, crane)"]
        lock_in: medium
        hermes_support: implemented
        differences:
          - "Inbound traffic must be HTTP/1.1, HTTP/2 (gRPC) or WebSockets; raw TCP/UDP listeners need GKE or Compute Engine"
          - "Request-driven autoscaling with per-instance concurrency; long background work needs instance-based billing (CPU always allocated) or jobs"
          - "Task IAM roles become per-service service accounts; secrets are injected from Secret Manager"
          - "Sidecars are supported as additional containers; ECS service discovery (Cloud Map) has no built-in equivalent"
        issues:
          - "Workloads relying on EFS volumes, privileged mode or host networking need redesign"
        references: ["https://docs.cloud.google.com/run/docs"]
      alibaba:
        service: "Serverless App Engine (SAE) applications"
        alternatives: ["Container Service for Kubernetes (ACK)", "Elastic Container Instance (ECI)"]
        compatibility: compatible
        complexity: medium
        data_migration: none
        workflow: container-workload
        tooling: ["Hermes Platform spec (workloads.compute)", "OCI image copy by digest (skopeo, crane)"]
        lock_in: medium
        hermes_support: implemented
        differences:
          - "Inbound traffic is exposed through CLB/ALB/NLB bindings rather than a built-in HTTPS endpoint"
          - "RAM roles replace task IAM roles; supported CPU/memory specifications differ from Fargate"
        issues:
          - "Confirm SAE availability and specifications in the chosen region"
