  # ---------------------------------------------------------------------------
  # Storage and backup
  # ---------------------------------------------------------------------------
  - id: aws-s3-bucket
    category: object-storage
    capability: storage
    source:
      provider: aws
      service: "Amazon S3"
      resource_types: ["AWS::S3::Bucket", "AWS::S3::BucketPolicy"]
    targets:
      gcp:
        service: "Cloud Storage"
        alternatives: []
        compatibility: compatible
        complexity: medium
        data_migration: required
        workflow: object-storage
        tooling: ["Storage Transfer Service (agentless; federated AWS role, no long-lived key; optional Google-managed private network)", "gcloud storage", "rclone"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "Bucket policies become IAM policies; use uniform bucket-level access (UBLA), so object ACLs are neither carried over nor used"
          - "Storage Transfer Service keeps Content-Type, Cache-Control, Content-Disposition and user metadata, stores the source ETag as x-goog-source-etag, and does not keep ACLs, object tags or timestamps"
          - "Event notifications become Pub/Sub notifications or Eventarc triggers"
          - "Signed URLs, multipart semantics and checksums differ (multipart S3 ETags are not MD5; composite GCS objects have only CRC32C)"
        issues:
          - "Archived objects (Glacier Flexible Retrieval, Deep Archive) must be restored before transfer"
          - "Only current versions transfer by default; noncurrent versions require a manifest"
          - "Age-based lifecycle rules restart from the transfer date because source timestamps are not preserved"
          - "S3 Object Lock retention and legal holds do not transfer; re-establish retention policies on the target"
        references:
          - "https://docs.cloud.google.com/storage-transfer/docs/metadata-preservation"
          - "https://docs.cloud.google.com/storage-transfer/docs/data-integrity"
          - "https://docs.cloud.google.com/storage-transfer/docs/create-transfers/agentless/managed-private-network"
      alibaba:
        service: "Object Storage Service (OSS)"
        alternatives: []
        compatibility: compatible
        complexity: medium
        data_migration: required
        workflow: object-storage
        tooling: ["Data Online Migration (Amazon S3 to OSS)", "ossimport", "ossutil", "rclone"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "OSS offers strong read-after-write consistency; bucket policies and RAM policies replace S3 bucket policies"
          - "Total user metadata is limited to 8 KB per object"
          - "Once enabled, versioning can only be suspended, as in S3"
        issues:
          - "Archived objects must be restored before transfer"
          - "AWS bills data transfer out and requests for the source side; OSS bills requests on the destination"
          - "Data Online Migration needs a long-lived IAM user access key for the source, migrates one bucket per task and cannot rely on S3 IP allowlists; create a dedicated read-only key behind an approval gate, keep it out of Hermes artifacts and revoke it in decommission"
          - "ossimport does not verify data after copying; validate separately"
        references:
          - "https://help.aliyun.com/en/data-online-migration/user-guide/migrate-data-from-amazon-s3-to-oss"
          - "https://help.aliyun.com/en/oss/user-guide/what-is-oss"

