  - id: aws-rds-postgresql
    category: relational-database
    capability: database
    source:
      provider: aws
      service: "Amazon RDS for PostgreSQL (single instance, Multi-AZ instance or Multi-AZ DB cluster)"
      resource_types: ["AWS::RDS::DBInstance", "AWS::RDS::DBCluster"]
      match:
        engine: ["postgres"]
    targets:
      gcp:
        service: "Cloud SQL for PostgreSQL"
        alternatives: ["AlloyDB for PostgreSQL"]
        compatibility: compatible
        complexity: medium
        data_migration: required
        workflow: relational-database-postgresql
        tooling: ["Google Database Migration Service (continuous, pglogical-based)", "pg_dump/pg_restore", "Native logical replication (publication/subscription)"]
        lock_in: low
        hermes_support: implemented
        differences:
          - "AWS-specific extensions (aws_s3, aws_lambda, aws_commons) have no equivalent; check every extension against the Cloud SQL list"
          - "Superuser is not available; cloudsqlsuperuser plays the role of rds_superuser"
          - "IAM database authentication is configured differently and is not supported on Google DMS destinations during migration"
          - "Multi-AZ failover repoints a DNS name to the standby; Cloud SQL regional HA fails over behind the same IP. Both drop open connections, and neither standby serves reads (Multi-AZ DB clusters do have readable standbys)"
        issues:
          - "Google DMS standard migrations replicate only the snapshot and INSERTs for tables without a primary key"
          - "DDL, large objects, users/roles, pg_cron jobs and C-language functions are not migrated by Google DMS"
          - "Destination automated backups and PITR are suspended during DMS replication until promotion"
