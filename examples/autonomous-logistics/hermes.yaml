# Autonomous drone logistics: cloud-side platform (reference example).
# Aligned with docs/architecture/autonomous-logistics-reference-architecture.md §3.
# SAFETY BOUNDARY: flight control, geofencing, emergency procedures and the OCC's command
# and control never depend on anything in this spec (reference architecture §0).
# Image references, the account ID and the certificate ARN are placeholders.
# Images use tags for readability; production specs should pin images by digest
# (image: registry/name@sha256:...) so a re-pushed tag cannot change what runs.
apiVersion: hermes/v1alpha1
kind: Platform

project:
  name: drone-logistics
  environment: dev
  owner: platform-team
  protected_environments: [production]

cloud:
  provider: aws                      # aws | gcp | alibaba; the spec below is otherwise unchanged
  region: eu-north-1                 # pick an EU region for data residency
  account: "123456789012"

state:
  backend: auto
  bucket: example-hermes-state

network: {cidr: 10.20.0.0/16, zones: 3, nat: true}

workloads:
  compute:
    type: containerized
    services:
      - name: api
        image: ghcr.io/example/logistics-api:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 2
        max_instances: 10
        public: true
        health_check_path: /healthz
        secret_env: {PAYMENT_API_KEY: payment-api-key}
        access: {publish: [orders], database: true}
      - name: partner-gw
        image: ghcr.io/example/partner-gateway:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 1
        max_instances: 5
        public: true
        health_check_path: /healthz
        secret_env: {PARTNER_WEBHOOK_KEY: partner-webhook-key}
        access: {publish: [orders], consume: [notify-partner], database: true}
      - name: orchestrator
        image: ghcr.io/example/orchestrator:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 1
        max_instances: 4
        health_check_path: /healthz
        access: {consume: [orders-orchestrator, missions-workflow], publish: [missions, notifications], database: true}
      - name: scheduler
        image: ghcr.io/example/mission-scheduler:1.0.0
        port: 8080
        cpu: 1
        memory_mb: 2048
        min_instances: 1
        max_instances: 4
        health_check_path: /healthz
        secret_env: {WEATHER_API_KEY: weather-api-key, AIRSPACE_CLIENT_KEY: airspace-client-key}
        access: {consume: [missions-scheduler], publish: [missions], database: true}
      - name: fleet
        image: ghcr.io/example/fleet:1.0.0
        port: 8080
        cpu: 0.25
        memory_mb: 512
        min_instances: 1
        max_instances: 2
        health_check_path: /healthz
        access: {buckets: {media: read-write, records: read-write}, database: true}
      - name: telemetry-ingest
        image: ghcr.io/example/telemetry-ingest:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 2             # warm: edge nodes backfill in bursts after reconnect
        max_instances: 10
        public: true                 # edge nodes push HTTPS batches; authenticate per edge node
        health_check_path: /healthz
        secret_env: {TRAFFIC_FEED_KEY: traffic-feed-key}
        access: {publish: [telemetry], buckets: {flight-logs: read-write}}
      - name: telemetry-writer
        image: ghcr.io/example/telemetry-writer:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 1
        max_instances: 6
        health_check_path: /healthz
        access: {consume: [telemetry-store], database: true}
      - name: notify
        image: ghcr.io/example/notify:1.0.0
        port: 8080
        cpu: 0.25
        memory_mb: 512
        min_instances: 0
        max_instances: 4
        health_check_path: /healthz
        secret_env: {PUSH_CREDENTIALS: push-credentials}
        access: {consume: [notifications-push]}
      - name: ops-dashboard
        image: ghcr.io/example/ops-dashboard:1.0.0
        port: 8080
        cpu: 0.5
        memory_mb: 1024
        min_instances: 1
        max_instances: 3
        # Operator UI: not exposed publicly without authentication. Operators reach it through an
        # identity-aware proxy / SSO (for example a zero-trust access proxy or a VPN with SSO).
        # On AWS and GCP Hermes gives a private service no URL and no service discovery
        # (docs/limitations.md, sections 3 and 4), so the proxy's path to it is out-of-band work:
        # for example GCP Identity-Aware Proxy in front of an internal load balancer, or on AWS an
        # internal load balancer reached through a VPN or a zero-trust access service. Hermes
        # creates neither the proxy nor that path.
        public: false
        health_check_path: /healthz
        access: {consume: [telemetry-dashboard, missions-dashboard], database: true}

  database:
    enabled: true
    engine: postgresql
    version: "16"
    size: medium
    storage_gb: 100
    max_storage_gb: 500
    high_availability: true
    backup_retention_days: 35
    point_in_time_recovery: true
    extensions: [postgis]            # NOT timescaledb: not portable across the three providers (§5.2)

  storage:
    enabled: true
    buckets:
      - {name: flight-logs, versioning: true, retention_days: 0}
      - {name: media, versioning: true, retention_days: 180}
      - {name: records, versioning: true, retention_days: 0}   # immutability lock: out of scope (§4)

  messaging:
    enabled: true
    topics:
      - name: orders
        retention_hours: 168
        subscriptions:
          - {name: orders-orchestrator, ack_deadline_seconds: 60, max_delivery_attempts: 5}
      - name: missions
        retention_hours: 168
        subscriptions:
          - {name: missions-scheduler, ack_deadline_seconds: 120, max_delivery_attempts: 5}
          - {name: missions-workflow, ack_deadline_seconds: 60, max_delivery_attempts: 5}
          - {name: missions-dashboard, ack_deadline_seconds: 10, max_delivery_attempts: 0}
      - name: telemetry
        retention_hours: 24
        subscriptions:
          - {name: telemetry-store, ack_deadline_seconds: 30, max_delivery_attempts: 10}
          - {name: telemetry-dashboard, ack_deadline_seconds: 10, max_delivery_attempts: 0}
      - name: notifications
        retention_hours: 72
        subscriptions:
          - {name: notifications-push, ack_deadline_seconds: 30, max_delivery_attempts: 5}
          - {name: notify-partner, ack_deadline_seconds: 30, max_delivery_attempts: 8}

  secrets:
    enabled: true
    names: [payment-api-key, partner-webhook-key, weather-api-key, airspace-client-key,
            traffic-feed-key, push-credentials]

  observability:
    enabled: true
    log_retention_days: 90
    metrics: true
    tracing: true

environments:
  dev: {}
  production:
    workloads: {database: {size: large}}

extensions:
  aws:
    # Required for the public services (api, partner-gw, telemetry-ingest) in the protected
    # production environment (ops-dashboard is private). Placeholder ARN.
    acm_certificate_arn: arn:aws:acm:eu-north-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
